<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Arcane Playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#999;color:white;font:14px Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;background:#363741dd;color:white;border:2px solid #222;border-radius:14px;padding:13px;font-size:17px;touch-action:none}#tools{position:absolute;right:12px;bottom:16px;display:flex;gap:7px}#move{position:absolute;left:12px;bottom:16px;display:flex;gap:7px}#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px black}#hp{height:13px;width:240px;background:#442d30;border:2px solid #222}#fill{height:100%;width:100%;background:#fa556c}#instructions{position:absolute;left:10px;top:10px;text-shadow:1px 2px 3px #111;font-size:12px}#menu{position:absolute;right:12px;top:12px}#options{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#32343ef5;border:2px solid #161820;padding:20px;width:min(380px,92vw);pointer-events:auto}#options button{display:block;width:100%;margin:6px 0}#options.show{display:block}
</style></head><body><canvas id="game"></canvas><div id="ui"><div id="instructions"><b>ARCANE PLAYGROUND</b><br>A/D move · Space jump · J punch · K dash · L magic<br>M menu · R restart</div><div id="hud"><div id="hp"><div id="fill"></div></div><span id="status">WAVE 1</span></div><button id="menu">☰</button><div id="move"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">⬆</button></div><div id="tools"><button data-k="punch">👊</button><button data-k="dash">➜</button><button data-k="magic">✦</button></div><div id="options"><h2>MAGIC</h2><button data-m="0">✦ Force blast</button><button data-m="1">⚡ Lightning</button><button data-m="2">◉ Gravity</button><button data-m="3">✹ Fireball</button><button id="resume">Resume</button></div></div><script>
(()=>{
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),keys={},touch={},R=(a,b)=>a+Math.random()*(b-a);
let w,h,dpr,ground,cam=0,last=0,wave=1,magicType=0,paused=false,actors=[],shots=[],fx=[],trees=[],player,shake=0;
function resize(){dpr=devicePixelRatio||1;w=canvas.width=innerWidth*dpr;h=canvas.height=innerHeight*dpr;ground=h*.81}onresize=resize;resize();
function dude(x,enemy){return {x,y:ground,vx:0,vy:0,dir:enemy?-1:1,enemy,hp:enemy?85:200,max:enemy?85:200,dead:false,cool:0,spell:0,stun:0,rag:0,spin:0,angle:0,attack:0,step:0,color:enemy?'#665b78':'#343440',light:enemy?'#d0a8ec':'#5ef8ef'}}
function start(){wave=1;actors=[];shots=[];fx=[];trees=[];player=dude(200*dpr,false);actors.push(player);for(let i=0;i<3;i++)actors.push(dude((700+i*200)*dpr,true));for(let x=-1200;x<6000;x+=290)trees.push({x:x*dpr,bush:Math.random()>.24,r:R(.7,1.4)});cam=0;paused=false;document.querySelector('#options').classList.remove('show')}start();
function bits(x,y,color,n=15){for(let i=0;i<n;i++)fx.push({x,y,vx:R(-7,7)*dpr,vy:R(-7,7)*dpr,t:R(.2,.6),color,r:R(1,4)*dpr})}
function hurt(a,dmg,kx,ky=-6){if(a.dead)return;a.hp-=dmg;a.vx+=kx*dpr;a.vy+=ky*dpr;a.rag=.7;a.stun=.22;a.spin+=kx*.012;shake=8*dpr;bits(a.x,a.y-60*dpr,a.light);if(a.hp<=0){a.dead=true;a.rag=4}}
function punch(a){if(a.dead||a.stun>0||a.cool>0)return;a.cool=.34;a.attack=.2;bits(a.x+a.dir*35*dpr,a.y-65*dpr,'#fff',5);for(const b of actors){if(b.dead||b.enemy===a.enemy)continue;let dx=b.x-a.x;if(Math.abs(dx)<90*dpr&&Math.abs(b.y-a.y)<90*dpr&&Math.sign(dx)===a.dir)hurt(b,16,a.dir*11)}}
function cast(a){if(a.dead||a.spell>0)return;a.spell=1.6;const m=a.enemy?0:magicType;shots.push({x:a.x+a.dir*35*dpr,y:a.y-65*dpr,vx:a.dir*(m===2?4: m===3?12:17)*dpr,vy:m===3?-3*dpr:0,r:(m===2?31:15)*dpr,t:m===2?1.4:1.8,m,owner:a});bits(a.x,a.y-65*dpr,['#7ff','#ffe16b','#b7a1ff','#ff9c47'][m])}
function line(x,y,X,Y,width,color){c.beginPath();c.strokeStyle=color;c.lineWidth=width*dpr;c.lineCap='round';c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}
function drawDude(a){const s=dpr;c.save();c.translate(a.x,a.y-47*s);c.rotate(a.angle);const x=0,y=47*s;let run=Math.sin(a.step)*Math.min(1,Math.abs(a.vx)/(7*s));c.globalAlpha=a.dead?.5:1;line(x,y-45*s,x-13*s+run*19*s,y,8,'#302d38');line(x,y-45*s,x+13*s-run*19*s,y,8,'#302d38');line(x,y-78*s,x-24*s-run*8*s,y-45*s,7,'#302d38');line(x,y-78*s,x+29*s+run*8*s,y-(a.attack>0?80:46)*s,7,'#302d38');line(x,y-80*s,x,y-43*s,19,a.color);c.fillStyle=a.color;c.beginPath();c.arc(x,y-99*s,16*s,0,7);c.fill();c.strokeStyle='#25242a';c.lineWidth=2*s;c.stroke();c.fillStyle=a.light;c.beginPath();c.arc(x+a.dir*7*s,y-99*s,3*s,0,7);c.fill();if(a.enemy&&!a.dead){c.fillStyle='#222';c.fillRect(-28*s,-132*s,56*s,6*s);c.fillStyle='#ef6a79';c.fillRect(-28*s,-132*s,56*s*Math.max(0,a.hp/a.max),6*s)}c.restore()}
function background(){c.fillStyle='#a0a0a2';c.fillRect(0,0,w,h);c.fillStyle='#949497';c.fillRect(0,ground,w,h-ground);c.fillStyle='#55555a';c.fillRect(0,ground,w,4*dpr);c.save();c.translate(-cam,0);for(const t of trees){if(t.x<cam-150*dpr||t.x>cam+w+150*dpr)continue;let s=t.r*dpr;if(t.bush){c.fillStyle='#665a4f';c.fillRect(t.x-6*s,ground-90*s,12*s,90*s);c.fillStyle='#bbd72f';c.strokeStyle='#65711c';c.lineWidth=3*s;c.beginPath();c.arc(t.x,ground-118*s,41*s,0,7);c.fill();c.stroke()}else{c.fillStyle='#77777b';c.fillRect(t.x,ground-20*s,40*s,20*s)}}c.restore()}
function update(dt){if(paused)return;for(const a of actors){a.cool=Math.max(0,a.cool-dt);a.spell=Math.max(0,a.spell-dt);a.stun=Math.max(0,a.stun-dt);a.attack=Math.max(0,a.attack-dt);a.rag=Math.max(0,a.rag-dt);
if(a===player&&!a.dead&&a.stun<=0){let dir=Number(keys.d||keys.ArrowRight||touch.right)-Number(keys.a||keys.ArrowLeft||touch.left);if(dir){a.dir=dir;a.vx+=dir*1.4*dpr}else a.vx*=.8;if((keys[' ']||keys.w||keys.ArrowUp||touch.jump)&&a.y>=ground)a.vy=-15*dpr;if(keys.j||touch.punch)punch(a);if(keys.k||touch.dash){if(!a.dashing){a.vx=a.dir*19*dpr;a.dashing=.35}}if(a.dashing)a.dashing=Math.max(0,a.dashing-dt);if(keys.l||touch.magic)cast(a)}
if(a.enemy&&!a.dead&&a.stun<=0){let dx=player.x-a.x;a.dir=dx>=0?1:-1;if(Math.abs(dx)<650*dpr){if(Math.abs(dx)>65*dpr)a.vx+=a.dir*.45*dpr;if(Math.abs(dx)<90*dpr)punch(a);if(Math.abs(dx)>160*dpr&&Math.abs(dx)<380*dpr&&Math.random()<dt*.24)cast(a)}}
a.vy+=.7*dpr;a.x+=a.vx=Math.max(-23*dpr,Math.min(23*dpr,a.vx));a.y+=a.vy;a.vx*=a.y>=ground?.83:.975;if(a.y>ground){a.y=ground;a.vy=0;a.spin*=.7}a.step+=Math.abs(a.vx)/(12*dpr);a.angle+=a.spin;a.spin*=.9;if(a.rag<=.1)a.angle*=.8}
for(const p of shots){p.t-=dt;p.x+=p.vx;p.y+=p.vy;if(p.m===3)p.vy+=.2*dpr;if(p.m===2){p.vx*=.94;for(const a of actors){if(a.enemy===p.owner.enemy||a.dead)continue;let dx=p.x-a.x,dy=p.y-(a.y-60*dpr);if(Math.hypot(dx,dy)<190*dpr){a.vx+=Math.sign(dx)*1.2*dpr;a.vy-=.5*dpr}}}for(const a of actors){if(a.dead||a.enemy===p.owner.enemy)continue;if(Math.hypot(p.x-a.x,p.y-(a.y-60*dpr))<p.r+21*dpr){hurt(a,p.m===3?28:24,Math.sign(p.vx)*16,p.m===3?-11:-6);bits(p.x,p.y,['#7ff','#ffe16b','#b7a1ff','#ff9c47'][p.m],25);p.t=0;break}}}shots=shots.filter(p=>p.t>0);for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.2*dpr;f.t-=dt}fx=fx.filter(f=>f.t>0);let live=actors.filter(a=>a.enemy&&!a.dead);if(!live.length){wave++;for(let i=0;i<Math.min(9,wave+2);i++)actors.push(dude(player.x+(550+i*140)*dpr,true));player.hp=Math.min(player.max,player.hp+40)}document.querySelector('#fill').style.width=Math.max(0,100*player.hp/player.max)+'%';document.querySelector('#status').textContent=player.dead?'DEFEATED · R TO RESTART':'WAVE '+wave+' · '+live.length+' ENEMIES · '+['FORCE','LIGHTNING','GRAVITY','FIRE'][magicType];cam+=(player.x-w*.38-cam)*.075;shake*=.85}
function render(){c.save();c.translate(R(-shake,shake),R(-shake,shake));background();c.translate(-cam,0);for(const a of actors)drawDude(a);for(const p of shots){c.fillStyle=['#8ff','#ffe16b','#b7a1ff','#ff9c47'][p.m];c.shadowColor=c.fillStyle;c.shadowBlur=20*dpr;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.shadowBlur=0}for(const f of fx){c.globalAlpha=Math.min(1,f.t*2);c.fillStyle=f.color;c.fillRect(f.x,f.y,f.r,f.r)}c.restore()}
function frame(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
onkeydown=e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='r')start();if(e.key==='m')toggle()};onkeyup=e=>keys[e.key]=false;
document.querySelectorAll('[data-k]').forEach(b=>{for(const e of ['pointerdown','pointerup','pointercancel','lostpointercapture'])b.addEventListener(e,ev=>{ev.preventDefault();touch[b.dataset.k]=e==='pointerdown';if(e==='pointerdown')b.setPointerCapture(ev.pointerId)})});
function toggle(){paused=!paused;document.querySelector('#options').classList.toggle('show',paused)}document.querySelector('#menu').onclick=toggle;document.querySelector('#resume').onclick=toggle;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{magicType=Number(b.dataset.m);toggle()});canvas.onpointerdown=e=>{if(e.clientX>innerWidth*.18&&e.clientX<innerWidth*.8){player.dir=e.clientX*dpr+cam>player.x?1:-1;punch(player)}};
})();
</script></body></html>
